<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario U13 | Liga Olmeca</title>
<style>
:root{--bg:#111318;--panel:#1d222b;--cell:#171b23;--line:#343b48;--orange:#f07827;--text:#f4f6fa;--muted:#a5afbd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Segoe UI,Arial,sans-serif}
header{background:linear-gradient(110deg,#090a0c,#20252c 70%,#4b260f);border-bottom:4px solid var(--orange);padding:22px 3vw}.head{max-width:1600px;margin:auto;display:flex;align-items:center;gap:18px}.logo{width:56px;height:56px;object-fit:contain}.title{font-size:clamp(24px,3.5vw,40px);font-weight:950;font-style:italic;line-height:1}.title span{color:var(--orange)}.season{margin-left:auto;border-left:4px solid var(--orange);padding:8px 0 8px 18px;font-weight:900}.season b{color:var(--orange)}
main{max-width:1600px;margin:20px auto;padding:0 20px 35px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}.calendar,.side{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.month{font-size:24px;font-weight:900;margin:0 12px}.ctl,select,button{background:#252b35;color:var(--text);border:1px solid #3b4350;border-radius:10px;padding:10px 13px;font:inherit}.ctl{cursor:pointer}.toolbar select{margin-left:auto}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{text-align:center;color:#aab6c7;font-weight:800;padding:7px}.day{min-height:125px;background:var(--cell);border:1px solid #303746;border-radius:11px;padding:7px;overflow:hidden}.day.other{opacity:.4}.num{color:#aab6c7;font-size:13px;margin-bottom:5px}.match{display:flex;align-items:center;gap:4px;background:#292f3a;border-left:3px solid var(--orange);border-radius:6px;padding:5px;margin:4px 0;font-size:10px;font-weight:800;min-width:0}.match .time{color:#ffb36a;white-space:nowrap}.match img{width:22px;height:22px;object-fit:contain;background:#111318}.match .vs{min-width:0;text-align:center;line-height:1.1}.match .vs small{display:block;color:#aab3bd;font-size:9px}.side h3{margin:0 0 12px;font-size:19px}.side p{color:var(--muted);line-height:1.6}.stats{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #303641}.back{display:inline-block;margin-top:18px;color:#ffad62;text-decoration:none;font-weight:800}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side .stats{margin:0}.day{min-height:105px}}
@media(max-width:650px){main{padding:0 8px 24px}.calendar{padding:8px}.month{font-size:19px;margin:0 4px}.toolbar select{margin-left:0}.grid{gap:3px}.weekday{font-size:11px;padding:4px 0}.day{min-height:75px;padding:3px;border-radius:6px}.num{font-size:11px}.match{padding:2px;gap:2px;font-size:8px;border-left-width:2px}.match img{width:15px;height:15px}.match .time{font-size:8px}.match .vs small{font-size:7px}.side{display:block}.season{display:none}}
</style></head><body><header><div class="head"><img class="logo" src="assets/Olmeca_Liga.png" alt="Liga Olmeca"><div class="title">LIGA OLMECA<br><span>SOFTBALL</span> U13</div><div class="season"><b>TEMPORADA</b> 2026–2027</div></div></header>
<main><div class="layout"><section class="calendar"><div class="toolbar"><button class="ctl" id="prev">‹</button><h2 class="month" id="month"></h2><button class="ctl" id="next">›</button><select id="team"><option value="Todos">Todos los equipos</option><option>Antílopes</option><option>Gacelas</option><option>Llamas</option><option>Impalas</option></select><button class="ctl" id="today">Ir a primera fecha</button></div><div class="grid" id="grid"></div></section><aside class="side"><div><h3>Jornada seleccionada</h3><p id="selected">Selecciona un día para consultar sus juegos.</p></div><div class="stats"><h3>Resumen del mes</h3><div class="stat"><span>Encuentros</span><b id="count">0</b></div><div class="stat"><span>Fechas con juegos</span><b id="dates">0</b></div><a class="back" href="index.html">← Regresar al portal</a></div></aside></div></main>
<script>
const games=[{"date":"2026-10-03","dateLabel":"03-Oct-26","day":"Sábado","time":"08:00","home":"Gacelas","away":"Antílopes"},{"date":"2026-10-03","dateLabel":"03-Oct-26","day":"Sábado","time":"10:00","home":"Llamas","away":"Impalas"},{"date":"2026-10-04","dateLabel":"04-Oct-26","day":"Domingo","time":"08:00","home":"Impalas","away":"Llamas"},{"date":"2026-10-04","dateLabel":"04-Oct-26","day":"Domingo","time":"10:00","home":"Antílopes","away":"Gacelas"},{"date":"2026-10-10","dateLabel":"10-Oct-26","day":"Sábado","time":"12:00","home":"Llamas","away":"Gacelas"},{"date":"2026-10-10","dateLabel":"10-Oct-26","day":"Sábado","time":"14:00","home":"Antílopes","away":"Impalas"},{"date":"2026-10-11","dateLabel":"11-Oct-26","day":"Domingo","time":"12:00","home":"Impalas","away":"Antílopes"},{"date":"2026-10-11","dateLabel":"11-Oct-26","day":"Domingo","time":"14:00","home":"Gacelas","away":"Llamas"},{"date":"2026-10-17","dateLabel":"17-Oct-26","day":"Sábado","time":"08:00","home":"Impalas","away":"Gacelas"},{"date":"2026-10-17","dateLabel":"17-Oct-26","day":"Sábado","time":"10:00","home":"Antílopes","away":"Llamas"},{"date":"2026-10-18","dateLabel":"18-Oct-26","day":"Domingo","time":"08:00","home":"Llamas","away":"Antílopes"},{"date":"2026-10-18","dateLabel":"18-Oct-26","day":"Domingo","time":"10:00","home":"Gacelas","away":"Impalas"},{"date":"2026-10-24","dateLabel":"24-Oct-26","day":"Sábado","time":"12:00","home":"Llamas","away":"Impalas"},{"date":"2026-10-24","dateLabel":"24-Oct-26","day":"Sábado","time":"14:00","home":"Gacelas","away":"Antílopes"},{"date":"2026-10-25","dateLabel":"25-Oct-26","day":"Domingo","time":"12:00","home":"Antílopes","away":"Gacelas"},{"date":"2026-10-25","dateLabel":"25-Oct-26","day":"Domingo","time":"14:00","home":"Impalas","away":"Llamas"},{"date":"2026-11-07","dateLabel":"07-Nov-26","day":"Sábado","time":"08:00","home":"Antílopes","away":"Impalas"},{"date":"2026-11-07","dateLabel":"07-Nov-26","day":"Sábado","time":"10:00","home":"Llamas","away":"Gacelas"},{"date":"2026-11-08","dateLabel":"08-Nov-26","day":"Domingo","time":"08:00","home":"Gacelas","away":"Llamas"},{"date":"2026-11-08","dateLabel":"08-Nov-26","day":"Domingo","time":"10:00","home":"Impalas","away":"Antílopes"},{"date":"2026-11-21","dateLabel":"21-Nov-26","day":"Sábado","time":"12:00","home":"Antílopes","away":"Llamas"},{"date":"2026-11-21","dateLabel":"21-Nov-26","day":"Sábado","time":"14:00","home":"Impalas","away":"Gacelas"},{"date":"2026-11-22","dateLabel":"22-Nov-26","day":"Domingo","time":"12:00","home":"Gacelas","away":"Impalas"},{"date":"2026-11-22","dateLabel":"22-Nov-26","day":"Domingo","time":"14:00","home":"Llamas","away":"Antílopes"},{"date":"2026-11-28","dateLabel":"28-Nov-26","day":"Sábado","time":"14:00","home":"Gacelas","away":"Antílopes"},{"date":"2026-11-28","dateLabel":"28-Nov-26","day":"Sábado","time":"16:00","home":"Llamas","away":"Impalas"},{"date":"2026-11-29","dateLabel":"29-Nov-26","day":"Domingo","time":"12:00","home":"Impalas","away":"Antílopes"},{"date":"2026-11-29","dateLabel":"29-Nov-26","day":"Domingo","time":"14:00","home":"Antílopes","away":"Llamas"},{"date":"2026-11-29","dateLabel":"29-Nov-26","day":"Domingo","time":"16:00","home":"Gacelas","away":"Llamas"},{"date":"2026-12-12","dateLabel":"12-Dec-26","day":"Sábado","time":"12:00","home":"Llamas","away":"Antílopes"},{"date":"2026-12-12","dateLabel":"12-Dec-26","day":"Sábado","time":"14:00","home":"Gacelas","away":"Impalas"},{"date":"2026-12-13","dateLabel":"13-Dec-26","day":"Domingo","time":"12:00","home":"Impalas","away":"Gacelas"},{"date":"2026-12-13","dateLabel":"13-Dec-26","day":"Domingo","time":"14:00","home":"Antílopes","away":"Llamas"},{"date":"2027-01-09","dateLabel":"09-Jan-27","day":"Sábado","time":"08:00","home":"Impalas","away":"Gacelas"},{"date":"2027-01-09","dateLabel":"09-Jan-27","day":"Sábado","time":"10:00","home":"Antílopes","away":"Llamas"},{"date":"2027-01-10","dateLabel":"10-Jan-27","day":"Domingo","time":"08:00","home":"Llamas","away":"Antílopes"},{"date":"2027-01-10","dateLabel":"10-Jan-27","day":"Domingo","time":"10:00","home":"Gacelas","away":"Impalas"},{"date":"2027-01-16","dateLabel":"16-Jan-27","day":"Sábado","time":"12:00","home":"Llamas","away":"Gacelas"},{"date":"2027-01-16","dateLabel":"16-Jan-27","day":"Sábado","time":"14:00","home":"Impalas","away":"Antílopes"},{"date":"2027-01-17","dateLabel":"17-Jan-27","day":"Domingo","time":"12:00","home":"Antílopes","away":"Impalas"},{"date":"2027-01-17","dateLabel":"17-Jan-27","day":"Domingo","time":"14:00","home":"Gacelas","away":"Llamas"},{"date":"2027-01-23","dateLabel":"23-Jan-27","day":"Sábado","time":"14:00","home":"Antílopes","away":"Impalas"},{"date":"2027-01-23","dateLabel":"23-Jan-27","day":"Sábado","time":"16:00","home":"Llamas","away":"Gacelas"},{"date":"2027-01-24","dateLabel":"24-Jan-27","day":"Domingo","time":"14:00","home":"Gacelas","away":"Impalas"},{"date":"2027-01-24","dateLabel":"24-Jan-27","day":"Domingo","time":"16:00","home":"Llamas","away":"Antílopes"},{"date":"2027-02-06","dateLabel":"06-Feb-27","day":"Sábado","time":"12:00","home":"Antílopes","away":"Impalas"},{"date":"2027-02-06","dateLabel":"06-Feb-27","day":"Sábado","time":"14:00","home":"Llamas","away":"Gacelas"},{"date":"2027-02-07","dateLabel":"07-Feb-27","day":"Domingo","time":"12:00","home":"Gacelas","away":"Llamas"},{"date":"2027-02-07","dateLabel":"07-Feb-27","day":"Domingo","time":"14:00","home":"Impalas","away":"Antílopes"}];const logos={'Antílopes':'Antilopes','Gacelas':'Gacelas','Llamas':'Llamas','Impalas':'Impalas'};
const team=document.getElementById('team'),grid=document.getElementById('grid');let cursor=new Date(2026,9,1),selected=null;
const fmt=new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric'});
function render(){document.getElementById('month').textContent=fmt.format(cursor).replace(/^./,x=>x.toUpperCase());grid.innerHTML='';
const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
const filtered=games.filter(g=>team.value==='Todos'||g.home===team.value||g.away===team.value);
for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=d.toISOString().slice(0,10),daygames=filtered.filter(g=>g.date===key);let cell=document.createElement('div');cell.className='day'+(d.getMonth()!==cursor.getMonth()?' other':'');cell.innerHTML='<div class="num">'+d.getDate()+'</div>'+daygames.map(g=>'<div class="match" title="'+g.home+' vs '+g.away+'"><span class="time">'+g.time+'</span><img src="assets/'+logos[g.home]+'.png" alt=""><span class="vs">'+g.home.slice(0,3).toUpperCase()+'<small>vs</small>'+g.away.slice(0,3).toUpperCase()+'</span><img src="assets/'+logos[g.away]+'.png" alt=""></div>').join('');cell.onclick=()=>{selected=key;document.getElementById('selected').innerHTML=daygames.length?daygames.map(g=>g.time+' · '+g.home+' vs '+g.away).join('<br>'):'Sin encuentros en esta fecha.'};grid.appendChild(cell)}
const monthgames=filtered.filter(g=>g.date.startsWith(cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')));document.getElementById('count').textContent=monthgames.length;document.getElementById('dates').textContent=new Set(monthgames.map(g=>g.date)).size;
}
document.querySelectorAll('.weekday').forEach(x=>x.remove());['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'].forEach(x=>{let e=document.createElement('div');e.className='weekday';e.textContent=x;grid.appendChild(e)});
document.getElementById('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};document.getElementById('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};document.getElementById('today').onclick=()=>{let d=new Date();cursor=new Date(d.getFullYear(),d.getMonth(),1);selected=d.toISOString().slice(0,10);render();document.getElementById('selected').textContent='Hoy · '+d.toLocaleDateString('es-MX')};team.onchange=render;render();
</script></body></html>
